services:
  frontend:
    image: node:20
    working_dir: /app
    user: "${LOCAL_UID:-1001}:${LOCAL_GID:-1001}"
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true

  db:
    image: mysql:8.0
    container_name: discord_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: discord_clone
    ports:
      - "3307:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20
    working_dir: /app
    user: "${LOCAL_UID:-1001}:${LOCAL_GID:-1001}"
    command: sh -c "if [ ! -x node_modules/.bin/tsx ] || [ ! -x node_modules/.bin/prisma ]; then npm ci; fi; npm run db:push && npm run db:generate && npm run db:seed && npm run dev"
    ports:
      - "3333:3333"
    volumes:
      - ./discord-backend:/app
      - ./discord-backend/node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:root@db:3306/discord_clone
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=discord_clone
    depends_on:
      db:
        condition: service_healthy
